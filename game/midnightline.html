<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミッドナイトライン ―澪原市いのちの電話―</title>
<style>
:root{
  --ink:#0a0d13;
  --ink2:#0f141d;
  --panel:#121a25;
  --line:#1e2a39;
  --amber:#f0c674;
  --amber-d:#9c7c3c;
  --cyan:#7fb6c9;
  --red:#c4443a;
  --paper:#e7e3d7;
  --dim:#8792a2;
  --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--paper);font-family:var(--sans);
  overflow:hidden;letter-spacing:.02em;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ===== ノイズ / スキャンライン(境界接近度で強まる署名演出) ===== */
#grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.05;mix-blend-mode:screen;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 3px);
  transition:opacity .8s}
#vhs{position:fixed;inset:0;pointer-events:none;z-index:61;opacity:0;transition:opacity .6s;
  background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.85) 100%)}
body.n1 #grain{opacity:.12} body.n2 #grain{opacity:.2} body.n3 #grain{opacity:.32}
body.n2 #vhs{opacity:.5} body.n3 #vhs{opacity:.85}
body.n3{animation:hue 6s infinite linear}
@keyframes hue{50%{filter:contrast(1.06) saturate(.85)}}
@keyframes shake{10%,90%{transform:translate(-1px,0)}20%,80%{transform:translate(2px,1px)}
  30%,50%,70%{transform:translate(-3px,-1px)}40%,60%{transform:translate(3px,1px)}}
body.shake #app{animation:shake .5s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:62;transition:opacity .12s}

/* ===== ヘッダ:業務端末のステータスバー ===== */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#131b26,#0d131c);font-size:12px;color:var(--dim);flex:none}
header .clock{font-family:var(--mincho);font-size:22px;color:var(--amber);letter-spacing:.12em;
  text-shadow:0 0 14px rgba(240,198,116,.35)}
header .day{letter-spacing:.18em}
header .chap{font-family:var(--mincho);color:var(--paper);letter-spacing:.1em;font-size:13px}
header .sp{flex:1}
header .lamp{width:9px;height:9px;border-radius:50%;background:#2a3444;display:inline-block;margin-right:6px}
header .lamp.on{background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.iconbtn{padding:6px 9px;border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:11px}
.iconbtn:hover{color:var(--amber);border-color:var(--amber-d)}

/* ===== レイアウト ===== */
main{flex:1;display:grid;grid-template-columns:210px 1fr 230px;min-height:0}
nav{border-right:1px solid var(--line);background:var(--ink2);padding:10px 8px;overflow:auto}
nav h4{font-size:10px;color:var(--dim);letter-spacing:.24em;margin:12px 6px 6px;font-weight:400}
nav button{display:block;width:100%;text-align:left;padding:8px 10px;font-size:12.5px;color:var(--dim);
  border-left:2px solid transparent;border-radius:0 3px 3px 0}
nav button:hover{color:var(--paper);background:#141d29}
nav button.act{color:var(--amber);border-left-color:var(--amber);background:#151f2c}
nav button .badge{float:right;font-size:10px;color:var(--red)}

/* 中央:通話ビュー */
#stage{position:relative;display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(80% 60% at 50% 0%,#16202d 0%,#0a0d13 70%)}
#caller{padding:14px 22px 6px;flex:none}
#caller .who{font-family:var(--mincho);font-size:26px;letter-spacing:.1em}
#caller .meta{font-size:11px;color:var(--dim);letter-spacing:.16em;margin-top:3px}
#wave{width:100%;height:64px;display:block;flex:none;opacity:.9}
#textwrap{flex:1;overflow:auto;padding:6px 22px 10px;min-height:0}
.tx{font-family:var(--mincho);font-size:17px;line-height:2.05;margin:0 0 14px;max-width:62ch}
.tx.nar{color:#b9c2cf}
.tx.sys{font-family:var(--sans);font-size:12.5px;color:var(--cyan);letter-spacing:.14em;line-height:1.9;
  border-left:2px solid var(--cyan);padding-left:10px}
.tx .nm{color:var(--amber);font-size:13px;letter-spacing:.16em;display:block;margin-bottom:2px;font-family:var(--sans)}
.tx.me .nm{color:var(--cyan)}
.tx.me{color:#dfe6ee}
.tx.wsp{color:#7c5c5c;font-size:15px}
.cursor{display:inline-block;width:8px;height:16px;background:var(--amber);animation:blink .8s infinite;vertical-align:-2px}
#choices{flex:none;padding:0 22px 18px;display:flex;flex-direction:column;gap:8px}
.cbtn{border:1px solid var(--line);background:#101823;padding:12px 14px;border-radius:5px;text-align:left;
  font-size:14px;line-height:1.6;position:relative;transition:.15s}
.cbtn:hover{border-color:var(--amber-d);background:#16202d;transform:translateX(3px)}
.cbtn:focus-visible{outline:2px solid var(--amber)}
.cbtn .tag{font-size:10px;color:var(--dim);letter-spacing:.16em;margin-right:8px}
.cbtn.silent{font-style:italic;color:#9fb0c0}
.cbtn.lock{opacity:.35;cursor:not-allowed}
.cbtn.hid{border-color:#3a2b4a;background:#150f1d}
.cbtn.hid .tag{color:#a98ac9}
#timer{height:3px;background:var(--red);width:100%;transform-origin:left;flex:none}
#next{position:absolute;right:18px;bottom:14px;font-size:11px;color:var(--dim);letter-spacing:.2em;animation:blink 1.4s infinite}

/* 右:パラメータ */
aside{border-left:1px solid var(--line);background:var(--ink2);padding:12px 12px;overflow:auto}
aside h4{font-size:10px;color:var(--dim);letter-spacing:.24em;margin:4px 0 10px;font-weight:400}
.pc{border:1px solid var(--line);border-radius:5px;padding:9px;margin-bottom:9px;background:#101722}
.pc .n{font-family:var(--mincho);font-size:14px;letter-spacing:.08em}
.pc .st{float:right;font-size:10px;letter-spacing:.12em;color:var(--dim)}
.pc .st.危機{color:var(--red)} .pc .st.混乱{color:#e08a4a} .pc .st.動揺{color:var(--amber)}
.pc .st.死亡,.pc .st.消失{color:#6d7a8a}
.bar{height:3px;background:#1b2534;border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s}
.lb{font-size:9.5px;color:var(--dim);letter-spacing:.12em;margin-top:5px}

/* パネル(資料) */
#panel{position:absolute;inset:0;background:rgba(8,11,16,.97);z-index:30;display:none;flex-direction:column}
#panel.on{display:flex}
#panel .ph{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex:none}
#panel .ph h3{font-family:var(--mincho);font-size:18px;letter-spacing:.16em;margin:0;flex:1;font-weight:400}
#panel .pb{flex:1;overflow:auto;padding:16px 18px}
.card{border:1px solid var(--line);border-left:2px solid var(--amber-d);background:#101722;border-radius:4px;
  padding:11px 13px;margin-bottom:10px}
.card h5{margin:0 0 5px;font-size:13.5px;font-family:var(--mincho);letter-spacing:.08em;font-weight:400}
.card p{margin:0;font-size:12.5px;line-height:1.85;color:#b9c2cf}
.card .d{font-size:10px;color:var(--dim);letter-spacing:.14em}
.card.hidn{border-left-color:#7c5c9c}
.card.evd{border-left-color:var(--cyan)}
.tools{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tools button{font-size:11px;border:1px solid var(--line);padding:5px 9px;border-radius:3px;color:var(--dim)}
.tools button:hover{color:var(--amber);border-color:var(--amber-d)}
.empty{color:var(--dim);font-size:12.5px;line-height:2;font-family:var(--mincho)}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:7px 8px;border-bottom:1px solid #172131;vertical-align:top;line-height:1.7}
td.t{color:var(--dim);white-space:nowrap;font-size:11px;letter-spacing:.1em}
.rel{font-size:12.5px;line-height:2.1;color:#b9c2cf;font-family:var(--mincho)}
.rel b{color:var(--amber);font-weight:400}
.rel.dot{color:#a98ac9}

/* タイトル/エンディング等のオーバーレイ */
.ov{position:fixed;inset:0;z-index:70;background:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px;text-align:center;overflow:auto}
.ov h1{font-family:var(--mincho);font-size:clamp(28px,7vw,54px);letter-spacing:.22em;margin:0 0 6px;font-weight:400}
.ov h1 small{display:block;font-size:12px;letter-spacing:.5em;color:var(--amber);margin-bottom:18px}
.ov .sub{font-family:var(--mincho);color:var(--dim);font-size:13px;letter-spacing:.3em;margin-bottom:34px}
.ov .mbtn{display:block;min-width:250px;border:1px solid var(--line);padding:13px;margin:7px auto;border-radius:4px;
  font-size:14px;letter-spacing:.16em;background:#101722}
.ov .mbtn:hover{border-color:var(--amber);color:var(--amber)}
.ov .mbtn small{display:block;font-size:10px;color:var(--dim);letter-spacing:.1em;margin-top:4px}
.ov p{font-family:var(--mincho);font-size:15px;line-height:2.2;max-width:56ch;color:#c6cedb}
.ov .endname{font-family:var(--mincho);font-size:clamp(26px,6vw,42px);letter-spacing:.3em;color:var(--amber)}
.fade{animation:fi 1.6s both}@keyframes fi{from{opacity:0}to{opacity:1}}
.chapcard{position:fixed;inset:0;z-index:65;background:#05070a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;animation:fi 1.2s both}
.chapcard .no{font-size:11px;letter-spacing:.5em;color:var(--dim);margin-bottom:14px}
.chapcard .ti{font-family:var(--mincho);font-size:clamp(24px,6vw,40px);letter-spacing:.24em}
.chapcard .dt{margin-top:16px;font-size:11px;letter-spacing:.3em;color:var(--amber-d)}

/* スチル */
.still{border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-bottom:12px}
.still .im{height:120px;position:relative;background:#0c1119}
.still .cap{padding:9px 12px;font-size:12px;color:#b9c2cf;line-height:1.8}
.still .cap b{display:block;font-family:var(--mincho);font-size:14px;color:var(--paper);font-weight:400;letter-spacing:.08em}
.still.lockd .im{filter:grayscale(1) brightness(.3)}
.still.lockd .cap b{color:var(--dim)}
#stillview{position:fixed;inset:0;z-index:66;background:#04060a;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:22px}
#stillview.on{display:flex;animation:fi 1s both}
#stillview .im{width:min(720px,92vw);height:min(330px,42vh);border:1px solid var(--line)}
#stillview .cp{font-family:var(--mincho);margin-top:18px;text-align:center;max-width:52ch;line-height:2;font-size:14px}
#stillview .cp b{display:block;font-size:18px;letter-spacing:.2em;margin-bottom:8px;color:var(--amber);font-weight:400}

/* モバイル */
#mobtabs{display:none}
@media(max-width:860px){
  main{grid-template-columns:1fr}
  nav,aside{position:absolute;inset:0;z-index:31;display:none;border:0}
  nav.on,aside.on{display:block}
  #mobtabs{display:flex;flex:none;border-top:1px solid var(--line);background:var(--ink2)}
  #mobtabs button{flex:1;padding:11px 0;font-size:11px;color:var(--dim);letter-spacing:.1em}
  #mobtabs button.act{color:var(--amber)}
  #caller .who{font-size:21px}
  .tx{font-size:16px;line-height:1.95}
  #textwrap{padding:6px 16px 10px}
  #choices{padding:0 16px 14px}
  header .clock{font-size:18px}
}

/* メモの〈信じる／疑う〉札（追補 §2） */
.tools button.on{ border-color:var(--amber); color:var(--amber); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="day" id="hDay">DAY 01</span>
    <span class="clock" id="hClock">22:00</span>
    <span class="chap" id="hChap">序章</span>
    <span class="sp"></span>
    <span id="hNoise"><i class="lamp" id="hLamp"></i><span id="hNoiseTx">回線良好</span></span>
    <button class="iconbtn" id="bSound">♪ ON</button>
    <button class="iconbtn" id="bMenu">MENU</button>
  </header>
  <main>
    <nav id="nav"></nav>
    <section id="stage">
      <div id="caller"><div class="who" id="cWho">みおはらライン</div><div class="meta" id="cMeta">待機中 — 着信なし</div></div>
      <canvas id="wave" width="900" height="64"></canvas>
      <div id="textwrap"><div id="text"></div></div>
      <div id="choices"></div>
      <div id="timer" style="transform:scaleX(0)"></div>
      <div id="next" style="display:none">▼ 続ける</div>
      <div id="panel"><div class="ph"><h3 id="pTitle"></h3><button class="iconbtn" id="pClose">閉じる</button></div><div class="pb" id="pBody"></div></div>
    </section>
    <aside id="aside"></aside>
  </main>
  <div id="mobtabs">
    <button data-m="call" class="act">通話</button>
    <button data-m="nav">資料</button>
    <button data-m="aside">相談者</button>
  </div>
</div>
<div id="grain"></div><div id="vhs"></div><div id="flash"></div>
<div id="stillview"><div class="im" id="svIm"></div><div class="cp" id="svCp"></div></div>
<div class="ov" id="title"></div>
<script>
/* ============================================================
   シナリオ本文データ
   ============================================================ */
const STILLS = [
 {id:'s01',t:'深夜の相談室',c:'蛍光灯がひとつだけ切れかけている。窓の外は霧。受話器は、まだ冷たい。',cond:'序章開始',
  bg:'linear-gradient(160deg,#0d1622 0%,#1b2836 50%,#0a0d13 100%)'},
 {id:'s02',t:'うたたねの少年',c:'受話器を持ったまま眠りかけている。頬に、コードの跡がついている。',cond:'レニィの信頼40以上',
  bg:'linear-gradient(140deg,#12203a,#2b4a7a 60%,#0d1622)'},
 {id:'s03',t:'三時三十三分の着信',c:'暗い画面に、着信表示だけが浮かぶ。番号の末尾が一瞬「1994」に明滅した。',cond:'第一章 ムニ初着信',
  bg:'radial-gradient(60% 80% at 50% 50%,#3a2f14,#0a0d13 70%)'},
 {id:'s04',t:'提灯の下の小さな影',c:'夏祭りの明かりの下、背伸びして公衆電話の受話器を握る子ども。提灯の色が、古い。',cond:'第一章終了',
  bg:'linear-gradient(0deg,#1a0f0a,#7a3a1a 40%,#2a1810 90%)'},
 {id:'s05',t:'破かれた尋ね人',c:'電柱のポスターに拳の影が落ちる。カナタ、十七歳、二週間前から行方不明。',cond:'第二章 失踪報道',
  bg:'linear-gradient(120deg,#241a12,#4a3320 50%,#0f0c0a)'},
 {id:'s06',t:'前髪の奥',c:'赤い右目。その虹彩に、ここではない場所の空が映り込んでいる。',cond:'ヒュウが右目を打ち明ける',
  bg:'radial-gradient(50% 70% at 55% 45%,#7a1a20,#1a2a20 60%,#0a0d13)'},
 {id:'s07',t:'追跡の夜',c:'揺れる街灯、走る呼吸、画面の端をかすめる——引きずるような、跛行の足音。',cond:'第三章 追跡イベント',
  bg:'linear-gradient(75deg,#0a0d13,#243040 30%,#0a0d13 60%,#1a2430)'},
 {id:'s08',t:'混線',c:'波形が画面を埋め尽くす。その奥に、剣を提げた金色のシルエットが立っている。',cond:'第四章 ネオ初通話',
  bg:'linear-gradient(180deg,#1a1608,#6a5a18 45%,#0a0d13)'},
 {id:'s09',t:'渡岸',c:'逆さまの空。落ちる途中で止まった雨。剣を杖にした男と、眠る少年。',cond:'ネオと協力関係',
  bg:'linear-gradient(200deg,#101a2a,#2a3a5a 40%,#5a4a2a 80%)'},
 {id:'s10',t:'十年前の受話器',c:'焼け落ちた礼拝堂の黒電話。壁の時計は、三時三十三分で溶けて止まっている。',cond:'逆探知に成功',
  bg:'radial-gradient(70% 70% at 40% 60%,#5a2a10,#1a0d08 70%)'},
 {id:'s11',t:'父の写真',c:'色褪せた家族写真。指が、父親の顔をちょうど隠している。',cond:'ゲルの正体を看破',
  bg:'linear-gradient(150deg,#2a1a2e,#5a3a5a 55%,#140d18)'},
 {id:'s12',t:'テープの独白',c:'回るカセット。ラベルの手書き文字——「8/14 3:33 未対応」。',cond:'室井のテープを発見',
  bg:'linear-gradient(90deg,#1a1a18,#4a4438 50%,#0d0d0c)'},
 {id:'s13',t:'炎の廊下',c:'煙の下を這う小さな手。その先に、物置の鍵が、光っている。',cond:'終章 ムニ脱出パート',
  bg:'linear-gradient(20deg,#2a0a05,#c4443a 45%,#f0c674 70%,#1a0a05)'},
 {id:'s14',t:'三本の回線',c:'三台の受話器を同時に握る手。過去と、現在と、ここではない場所が、一本に繋がる。',cond:'終章 クライマックス',
  bg:'linear-gradient(120deg,#0a0d13,#7fb6c9 33%,#f0c674 66%,#c4443a 100%)'},
 {id:'s15',t:'あさやけ',c:'朝焼けの相談室。窓の外の霧が、十年ぶりに晴れていく。',cond:'TRUE END',
  bg:'linear-gradient(0deg,#f0c674,#e08a6a 30%,#7fb6c9 70%,#1a2a3a)'},
 {id:'s16',t:'はじめまして',c:'十五歳になったムニが、現代のスマートフォンで電話をかけている。隣で兄があくびをしている。',cond:'TRUE END 最終',
  bg:'linear-gradient(160deg,#9ec9ff,#f0e0c0 60%,#7fa8ff)'},
 {id:'s17',t:'発信者不明',c:'渡岸の岸辺に落ちていた一台の黒電話。それを拾い上げたのは、まだ小さな——あなただった。',cond:'SECRET END',
  bg:'radial-gradient(60% 60% at 50% 50%,#c4443a,#1a0d18 65%,#000)'},
 {id:'s18',t:'名札の裏',c:'外された「室井」の名札。裏側に、擦れた鉛筆でこう書かれている——「次の子へ」。',cond:'周回2以上で序章',
  bg:'linear-gradient(45deg,#1a1c18,#8a8470 50%,#0d0e0c)'}
];

const ENDINGS = {
 BAD:{name:'不 通',text:'八月十五日の朝、澪原市は地図から消えた。<br>誰もいない相談室で、電話だけが鳴り続けている。受話器を取ると、砂嵐の底から、聞き覚えのある声がいくつも重なって聞こえる——けれど、もう誰の言葉も、言葉の形をしていない。<br><br>ツー、ツー、ツー。'},
 NORMAL:{name:'留守番電話',text:'失踪事件は終わった。皆、生きている。<br>けれど誰も、十年前に何があったのかを知らないままだ。レニィは今日も眠そうに笑い、自分の中の空洞に気づかないふりをしている。<br><br>その夜、三時三十三分。<br>着信が一件。取っても、誰も出ない。<br>あなたは受話器を耳に当てたまま、朝まで待った。'},
 GOOD:{name:'開 通',text:'灰堂帰一は逮捕され、剛三の冤罪は晴れた。攫われた者たちは戻り、街は少しずつ夏を取り戻していく。<br>ただ一人、十年前の八月十四日から戻れなかった子どもを除いて。<br><br>レニィは弟の墓の前で、ようやくその名前を思い出した。あなたはもう繋がらない番号に一度だけ発信し、呼び出し音を七回聞いてから、そっと受話器を置いた。<br>これは、救えたと呼ぶには少しだけ苦い夜明けだった。'},
 TRUE:{name:'あさやけ',text:'三時三十三分、十年前と現在が一本の回線で繋がった。<br>あなたの声だけが、燃える廊下を這う小さな背中に届いた。煙の下を、教えたとおりに。物置の鍵は、教えたところに。怖くなったら、この声を思い出して。<br><br>——朝が来る。<br>霧が晴れていく相談室で、電話が鳴る。<br>知らない番号だ。けれど、あなたは受話器を取る。取らない未来は、もうどこにもない。<br><br>「はじめまして。……でも、なんだか、なつかしい声だね」'},

<script>
/* ============================================================
   ミッドナイトライン ― コア
   DOM に一切触れない部分：状態・フラグ・条件評価・パラメータ・
   ノードの状態変更・制御フロー解決・エンディング判定。

   ここに置いたものは engine.js（ブラウザ）と tools/check.mjs（Node）の
   両方から同じ実装として使われる。検証スクリプトが本番と違う挙動を
   再実装してしまわないようにするための分離。
   ============================================================ */

const CHARS = {
  LEN:{name:'レニィ',sub:'男子学生・青い髪',col:'#7fa8ff'},
  HYU:{name:'ヒュウ',sub:'男子学生・緑の髪',col:'#7fd3a0'},
  JIN:{name:'ジンパチ',sub:'男子学生・茶髪',col:'#f0a05a'},
  MUN:{name:'ムニ',sub:'5歳・青い髪',col:'#9ec9ff'},
  GER:{name:'ゲル',sub:'女性・紫の髪',col:'#c08adf'},
  NEO:{name:'ネオ',sub:'???',col:'#f0d878'},
  KAI:{name:'灰堂帰一',sub:'医師',col:'#a0a8b4'},
  MRI:{name:'室井',sub:'前任相談員',col:'#a0a8b4'},
  CAN:{name:'カナタ',sub:'ジンパチの親友',col:'#a0a8b4'},
  UNK:{name:'???',sub:'発信者不明',col:'#c4443a'},
  ME :{name:'あなた',sub:'夜間相談員',col:'#7fb6c9'}
};
const TRACKED = ['LEN','HYU','JIN','MUN','GER','NEO'];

/* ---------- 状態 ----------
   S = 周回内の状態（セーブ対象） / G = 周回を跨ぐ状態 */
let S, G;

/* UI 側フック。engine.js が実装を差し込む。
   Node での検証時は既定の no-op のまま使う。 */
const Hooks = {
  par(){}, meet(){}, memo(){}, evd(){}, vm(){}, rec(){}, tlfix(){}, toastx(){},
  vmLost(){}, shift(){}, hold(){}, resume(){}, noise(){}
};

/* 勤務時間 22:00〜04:00 ＝ 360分。追補 §6-1 */
const SHIFT_END = 28 * 60;

function newChar(){ return {trust:20,doubt:0,fear:0,stress:0,state:'安定',life:'生存',known:[]}; }
function newState(loopCarry){
  const c = {}; TRACKED.forEach(k => c[k] = newChar());
  return {
    loop: loopCarry ? loopCarry.loops + 1 : 1,
    day:1, chapter:'pro', chapTitle:'序章 もしもし、きこえますか',
    clock:22*60, flags:{}, chars:c, noise:0,
    memo:[], evd:[], tl:[
      {d:'10年前 8/14',t:'児童養護施設「灯守園」で火災。園児1名が死亡、職員1名が放火犯として服役。'},
      {d:'　　　　　　',t:'（　　　　　　　　　　　　　　　）'},
      {d:'2週間前',t:'市内で若者の失踪が相次ぐ。'}
    ],
    rel:[], vm:[], hist:[], recs:[], stills:[], cur:null, callStart:null,
    held:null, overNoted:0, dialLog:{}
  };
}
function setState(s){ S = s; }
function setGlobal(g){ G = g; }

const F  = k => !!S.flags[k];
const SET= (k,v=1) => { S.flags[k]=v; };
const CNT= k => S.flags[k]|0;

function clockStr(m){ m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

/* ---------- 通話時間の資源性（追補 §6） ---------- */
function timeLeft(){ return Math.max(0, SHIFT_END - S.clock); }
/* 超過した夜ごとに疲労が1段。最大4段＝制限時間が約半分になる */
function fatigue(){ return Math.min(4, CNT('OVERTIME')); }
function realSec(sec){ return Math.max(5, Math.round(sec * (1 - 0.12 * fatigue()))); }
/* 04:00 を跨いだ最初の一回だけ OVERTIME を加算する */
function checkShift(){
  if(timeLeft() > 0){ S.overNoted = 0; return false; }
  if(S.overNoted) return false;
  S.overNoted = 1;
  SET('OVERTIME', CNT('OVERTIME') + 1);
  Hooks.shift();
  return true;
}

/* ---------- 保留（追補 §6-3） ----------
   待たされた側は、待たされた分数に比例して削れる。 */
function holdLine(c){ S.held = {c, since:S.clock}; Hooks.hold(c); }
function resumeLine(){
  if(!S.held) return 0;
  const min = Math.max(1, S.clock - S.held.since), c = S.held.c;
  applyPar({c, fear:Math.round(min*1.2), stress:Math.round(min*0.9), trust:-Math.round(min*0.3)});
  S.held = null;
  Hooks.resume(min, c);
  return min;
}

/* ---------- 留守番電話の保存期限（追補 §5-1） ----------
   記録媒体は二晩ぶん。当夜と翌夜は残り、三晩目に上書きされる。
   聞かないまま消えたぶんは VM_MISS に累積し、発信者ごとの代償が入る。 */
function expireVM(){
  let lost = 0;
  S.vm.forEach(v=>{
    if(v.played || v.dead) return;
    if(S.day - v.d < 2) return;
    v.dead = 1; lost++;
    SET('VM_MISS', CNT('VM_MISS') + 1);
    if(v.k) SET('VM_LOST_'+v.k);
    if(v.pen) applyPar(v.pen);
  });
  if(!lost) return 0;
  const n = CNT('VM_MISS');
  // 累積の代償：個別の損失とは別に、部屋の空気そのものが劣化する（追補 §5-3）
  if(n === 3){
    TRACKED.forEach(k=>{ if(S.chars[k].life==='生存') applyPar({c:k, stress:6, doubt:5}); });
  }
  if(n >= 5){
    applyPar({c:'MUN', fear:12, doubt:8});
    S.noise = Math.min(3, S.noise + 1); Hooks.noise();
  }
  Hooks.vmLost(lost, n);
  return lost;
}

/* ---------- 条件評価 ----------
   上から最初に一致したキーだけを見て返す（複数キー併記は先勝ち）。 */
function cond(c){
  if(!c) return true;
  if(c.and) return c.and.every(cond);
  if(c.or)  return c.or.some(cond);
  if(c.f)   return F(c.f);
  if(c.nf)  return !F(c.nf);
  if(c.cnt) return CNT(c.cnt[0]) >= c.cnt[1];
  if(c.tr)  return S.chars[c.tr[0]].trust >= c.tr[1];
  if(c.dbt) return S.chars[c.dbt[0]].doubt >= c.dbt[1];
  if(c.ndbt) return S.chars[c.ndbt[0]].doubt <  c.ndbt[1];  // 疑念が閾値未満（追補 §1-2）
  if(c.mb)   return F('MB_'+c.mb);                          // メモに〈信じる〉札（追補 §2）
  if(c.md)   return F('MD_'+c.md);                          // メモに〈疑う〉札
  if(c.time) return timeLeft() >= c.time;                   // 残り通話時間（追補 §6-1）
  if(c.held) return !!S.held;                               // 保留中の回線がある
  if(c.alive) return S.chars[c.alive].life === '生存';
  if(c.loop)  return S.loop >= c.loop;
  if(c.recs)  return (G.recs||[]).length >= c.recs;      // 裏を暴いた録音の累計（周回跨ぎ）
  if(c.cleared) return (G.endings||[]).includes(c.cleared); // 到達済みエンディング（周回跨ぎ）
  return true;
}

/* ---------- パラメータ ---------- */
function applyPar(p){
  const c = S.chars[p.c]; if(!c) return;
  ['trust','doubt','fear','stress'].forEach(k=>{ if(p[k]!=null) c[k] = Math.max(0,Math.min(100,c[k]+p[k])); });
  const f = c.fear, st = c.stress;
  c.state = (c.life!=='生存') ? c.life : (f>75||st>85 ? '危機' : f>50||st>60 ? '混乱' : f>25||st>35 ? '動揺' : '安定');
  Hooks.par();
}

/* ---------- ノードの状態変更 ----------
   exec() のうち DOM に触れない部分。engine.js と check.mjs の共通実装。
   キーの評価順は元実装の exec() と同一。 */
function applyData(nd){
  if(nd.set){ Object.entries(nd.set).forEach(([k,v])=>SET(k,v)); }
  if(nd.inc){ Object.entries(nd.inc).forEach(([k,v])=>SET(k, CNT(k)+v)); }
  if(nd.par){ applyPar(nd.par); }
  // meet / know は TRACKED 外のキャラ（灰堂・室井など）にも使われる。
  // その場合パラメータの器が無いので、フラグだけ立てて器の操作は飛ばす。
  if(nd.meet){ SET('MET_'+nd.meet); const c = S.chars[nd.meet]; if(c) c.known = nd.known||[]; Hooks.meet(); }
  if(nd.know){ const c = S.chars[nd.know[0]]; if(c && !c.known.includes(nd.know[1])) c.known.push(nd.know[1]); }
  if(nd.life){ S.chars[nd.life[0]].life = nd.life[1]; applyPar({c:nd.life[0]}); }
  // memo[2] があると〈信じる／疑う〉の札を付けられるキー付きメモになる（追補 §2）
  if(nd.memo){ S.memo.push({d:S.day, t:nd.memo[0], x:nd.memo[1], k:nd.memo[2]||null, mark:null}); Hooks.memo(nd.memo[0]); }
  if(nd.evd){ S.evd.push({t:nd.evd[0], x:nd.evd[1]}); Hooks.evd(nd.evd[0]); }
  if(nd.tl){ S.tl.push({d:nd.tl[0], t:nd.tl[1]}); }
  if(nd.tlfix){ const e = S.tl[1]; e.d = nd.tlfix[0]; e.t = nd.tlfix[1]; Hooks.tlfix(); }
  if(nd.rel){ S.rel.push({a:nd.rel[0], t:nd.rel[1], b:nd.rel[2], dot:nd.rel[3]}); }
  // vm[2]=キー / vm[3]=発信者 / vm[4]=上書きされた場合のペナルティ（追補 §5-2）
  if(nd.vm){ S.vm.push({d:S.day, c:clockStr(S.clock), w:nd.vm[0], x:nd.vm[1],
      k:nd.vm[2]||null, who:nd.vm[3]||null, pen:nd.vm[4]||null, played:0, dead:0}); Hooks.vm(); }
  if(nd.rec){ S.recs.push({id:nd.rec.id, day:S.day, ti:nd.rec.ti, tx:nd.rec.tx, hid:nd.rec.hid, flag:nd.rec.flag,
      opened:(G.recs||[]).includes(nd.rec.id)?1:0}); Hooks.rec(); }
  if(nd.toastx){ Hooks.toastx(); }
}

/* 時刻・日付の変更（DOM 更新は呼び出し側の責務） */
function applyTime(nd){
  if(nd.clock){ const [h,m] = nd.clock.split(':').map(Number); S.clock = h*60+m; }
  if(nd.day){
    const prev = S.day;
    S.day = nd.day; S.clock = 22*60; S.overNoted = 0;
    if(S.day > prev) expireVM();   // 夜が明けるたびに古い留守電が上書きされる
  }
}

/* ---------- メモの札（追補 §2） ----------
   同じ札をもう一度押すと保留（未記入）に戻る。札は相手には見えない。 */
function markMemo(m, v){
  if(!m || !m.k) return;
  delete S.flags['MB_'+m.k]; delete S.flags['MD_'+m.k];
  m.mark = (m.mark === v) ? null : v;
  if(m.mark === 'b') SET('MB_'+m.k);
  if(m.mark === 'd') SET('MD_'+m.k);
}

/* ---------- 選択肢の状態変更 ---------- */
function applyChoice(o){
  S.clock += o.cost || 2;
  if(o.eff) Object.entries(o.eff).forEach(([k,v])=>{
    const [c,p] = k.split('.'); applyPar({c, [p]: v});
  });
  if(o.set) Object.entries(o.set).forEach(([k,v])=>SET(k,v));
  if(o.inc) Object.entries(o.inc).forEach(([k,v])=>SET(k, CNT(k)+v));
  if(o.memo) S.memo.push({d:S.day,t:o.memo[0],x:o.memo[1]});
}

/* 表示される選択肢（hide が不成立のものは存在しない） */
function visibleChoices(nd){ return nd.ch.filter(o => !o.hide || cond(o.hide)); }
/* 実際に押せる選択肢（req 不成立はロック表示される） */
function selectableChoices(nd){ return visibleChoices(nd).filter(o => cond(o.req)); }
/* 制限時間切れで自動選択されるもの */
function timeoutChoice(nd){
  const list = visibleChoices(nd);
  return nd.ch.find(o=>o.timeout) || list[list.length-1];
}

/* ---------- 制御フロー ----------
   go は if より先に評価される（元実装の順序を保存）。
   if が成立すれば go の行き先を上書きし、不成立で els が無ければ go のまま。
   戻り値: ジャンプ先ラベル名 / ジャンプ不要なら null */
function resolveJump(nd){
  let target = null;
  if(nd.go) target = nd.go;
  if(nd.if){
    if(cond(nd.if)) target = nd.go2 || nd.then;
    else if(nd.els) target = nd.els;
  }
  return target;
}

/* ---------- エンディング判定 ----------
   条件は design.md §6（エンディング表）と §12（TRUE/SECRET解放条件）に対応する。
   §12 の条件リストのほうが具体的なので、両者が食い違う場合は §12 を採る。 */
const REC_ALL = 7;   // 隠し録音の総数（r01〜r07）

function judge(){
  const alive = k => S.chars[k].life === '生存';
  // 「現在組」= 主人公が電話で関わる5名。ムニは十年前の人物なので含まない
  const MAIN = ['LEN','JIN','GER','HYU','NEO'];
  const allAlive = MAIN.every(alive);
  const mainAlive = MAIN.filter(alive).length;

  // GOOD: 灰堂逮捕 + 剛三冤罪証明 + 現在組全員生存
  const goodBase = F('KAI_EXPOSE_01') && F('GER_KNIFE_01') && F('JIN_RUSH_01') && alive('LEN');
  // TRUE (§12): ①刷り込み3点 ②ムニ回線の切電 ③全員生存 ④テープ+波形の照合 ⑤共闘 ⑥真相解放
  const trueCond = goodBase && allAlive
    && F('MUN_TEACH_01') && F('MUN_TEACH_02') && F('MUN_TEACH_03')
    && CNT('MUN_CUT_XX') < 2 && F('EVD_TAPE_01') && F('EVD_WAVE_01') && F('NEO_HYU_01') && F('STORY_TRUE_KEY');
  // SECRET (§12): TRUEクリア後の周回で隠し番号へ発信 + 隠し録音を全回収
  const secretCond = trueCond && F('SEC_CALL_01')
    && (G.recs||[]).length >= REC_ALL && (G.endings||[]).includes('TRUE');

  if(secretCond) return 'SECRET';
  if(trueCond) return 'TRUE';
  if(goodBase && allAlive) return 'GOOD';
  // BAD (§6): 主要生存者2名以下、または裂け目閉鎖失敗（＝街が地図から消える）
  if(mainAlive <= 2 || !F('RIFT_CLOSED')) return 'BAD';
  return 'NORMAL';
}

const mem = {};

/* ---------- 音響(WebAudio・素材不要) ---------- */
const AU = {
  ctx:null, on:true, amb:null, ambGain:null,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  g(v){ const g = this.ctx.createGain(); g.gain.value = v; g.connect(this.ctx.destination); return g; },
  beep(f,d,v=.05,type='sine'){ if(!this.on) return; this.init(); if(!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.g(0); o.type = type; o.frequency.value = f;
    o.connect(g); o.start();
    g.gain.linearRampToValueAtTime(v, this.ctx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001, this.ctx.currentTime+d);
    o.stop(this.ctx.currentTime+d+.02);
  },
  ring(kind){ if(!this.on) return; this.init(); if(!this.ctx) return;
    if(kind==='old'){ // 十年前の黒電話
      for(let i=0;i<7;i++) setTimeout(()=>this.beep(1050,.06,.05,'triangle'),i*90);
    } else if(kind==='broken'){ // 文字化け着信
      for(let i=0;i<6;i++) setTimeout(()=>this.beep(300+Math.random()*900,.09,.045,'square'),i*70);
    } else { this.beep(880,.18,.045,'sine'); setTimeout(()=>this.beep(880,.18,.045,'sine'),240); }
  },
  hang(kind){ if(!this.on) return; this.init(); if(!this.ctx) return;
    if(kind==='silent') return;
    if(kind==='cut'){ this.beep(180,.05,.06,'square'); return; }
    this.beep(400,.5,.035,'sine');
  },
  noise(sec=.5,v=.05){ if(!this.on) return; this.init(); if(!this.ctx) return;
    const b = this.ctx.createBuffer(1, this.ctx.sampleRate*sec, this.ctx.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*.6;
    const s = this.ctx.createBufferSource(); s.buffer = b;
    const f = this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200;
    const g = this.g(v); s.connect(f); f.connect(g); s.start();
  },
  ambient(level){ // 章ごとの空気(低周波ドローン)
    if(!this.on) return; this.init(); if(!this.ctx) return;
    if(this.amb){ try{ this.amb.forEach(o=>o.stop()); }catch(e){} this.amb=null; }
    const base = [55,58.3,73.4,49,41.2,65.4,87][level] || 55;
    const g = this.g(.012); this.ambGain = g; const list = [];
    [1,1.5,2.02].forEach((m,i)=>{ const o = this.ctx.createOscillator();
      o.type = i===2?'triangle':'sine'; o.frequency.value = base*m; o.connect(g); o.start(); list.push(o); });
    this.amb = list;
  },
  stopAmb(){ if(this.amb){ try{ this.amb.forEach(o=>o.stop()); }catch(e){} this.amb=null; } },
  click(){ this.beep(1400,.03,.02,'square'); }
};

/* 波形(署名演出:声の状態で揺れる) */
const wv = {cv:null,ct:null,amp:0,col:'#f0c674',t:0};
function waveInit(){ wv.cv = $('#wave'); wv.ct = wv.cv.getContext('2d'); loopWave(); }
function loopWave(){
  const c = wv.ct, W = wv.cv.width, H = wv.cv.height; wv.t += .05;
  c.clearRect(0,0,W,H);
  const n = S ? S.noise : 0;
  c.strokeStyle = wv.col; c.lineWidth = 1.2; c.globalAlpha = .85; c.beginPath();
  for(let x=0;x<W;x+=2){
    const base = Math.sin(x*.02 + wv.t)*Math.sin(x*.005 - wv.t*.6);
    const noi = (Math.random()-.5)*n*4;
    const y = H/2 + base*wv.amp*H*.38 + noi;
    x===0 ? c.moveTo(x,y) : c.lineTo(x,y);
  }
  c.stroke();
  if(n>=2){ c.globalAlpha=.35; c.strokeStyle='#c4443a'; c.beginPath();
    for(let x=0;x<W;x+=3){ const y = H/2 + Math.sin(x*.05 - wv.t*1.7)*wv.amp*H*.2 + (Math.random()-.5)*n*3;
      x===0?c.moveTo(x,y):c.lineTo(x,y); } c.stroke(); }
  c.globalAlpha = 1;
  wv.amp *= .93;
  requestAnimationFrame(loopWave);
}

function pushLine(html, cls){
  const d = document.createElement('div'); d.className = 'tx '+(cls||''); d.innerHTML = html;
  $('#text').appendChild(d);
  const w = $('#textwrap'); w.scrollTop = w.scrollHeight;
  return d;
}
function typeInto(el, text, speed, done){
  let i = 0; el._full = (el.innerHTML||'') + text; el._done = done; const cur = document.createElement('span'); cur.className='cursor';
  const body = document.createElement('span'); el.appendChild(body); el.appendChild(cur);
  clearInterval(typing);
  typing = setInterval(()=>{
    if(i >= text.length){ clearInterval(typing); typing=null; cur.remove(); done && done(); return; }
    body.textContent += text[i++];
    wv.amp = Math.min(1, wv.amp + .25);
    if(i%3===0) $('#textwrap').scrollTop = $('#textwrap').scrollHeight;
  }, speed);
}
function skipType(){
  if(typing){
    clearInterval(typing); typing = null;
    const el = $('#text').lastChild;
    if(el && el._full) el.innerHTML = el._full;
    if(el && el._done){ const d = el._done; el._done = null; running = false; d(); }
    return true;
  }
  return false;
}

  G.stills = G.stills||[]; if(!G.stills.includes(id)) G.stills.push(id);
  AU.beep(520,.5,.03,'sine');
  showStill(id, cont);
}

/* ---------- core からの通知を UI に繋ぐ ---------- */
Hooks.par   = () => renderAside();
Hooks.meet  = () => renderAside();
Hooks.memo  = t => toast('相談メモに記録：'+t);
Hooks.evd   = t => toast('証拠を入手：'+t);
Hooks.vm    = () => { renderNav(); toast('留守番電話に1件のメッセージ'); };
Hooks.rec   = () => { renderNav(); toast('通話を録音しました'); };
Hooks.tlfix = () => toast('事件年表の空白が埋まった。');
Hooks.toastx= () => { const n = ['MUN_TEACH_01','MUN_TEACH_02','MUN_TEACH_03'].filter(F).length;
                      toast('ムニに教えたこと '+n+' / 3'); };
Hooks.noise = () => refreshHead();
Hooks.shift = () => {
  if(CNT('OVERTIME') >= 2) toast('疲労が溜まっている。判断できる時間が短くなった。');
  pushLine('午前四時。勤務時間は終了した。<br>それでも受話器を置けないなら、置かないでいい。ただし、明日の夜のあなたは、今夜より少し疲れている。','sys');
  AU.beep(300,.9,.03,'sine'); refreshHead();
};
Hooks.vmLost = (lost, n) => {
  pushLine(`留守番電話 ${lost}件が、新しい着信に上書きされた。<br>——聞かないまま消えたメッセージ：累計 ${n}件`,'sys');
  AU.beep(140,.7,.045,'sawtooth'); toast('未再生の留守電が上書きされました');
  if(n === 3) pushLine('この部屋には、聞かれなかった声が溜まっていく。<br>受話器を取っても、相手が本題に入るまでの時間が、少しずつ長くなった。','nar');
  if(n >= 5) pushLine('無言の着信が増えた。取っても、誰も喋らない。<br>——ただ、切る直前に、いつも同じ雨音がする。','nar');
  renderNav(); renderAside(); refreshHead();
};
Hooks.hold   = () => {
  $('#cMeta').textContent = (S.cur?S.cur.num:'') + ' ／ 保留中';
  AU.beep(660,.2,.02,'triangle'); setTimeout(()=>AU.beep(880,.2,.02,'triangle'),220);
  pushLine('回線を保留にした。保留音——オルゴールの、あの曲。','sys');
};
Hooks.resume = (min) => {
  $('#cMeta').textContent = (S.cur?S.cur.num:'') + ' ／ 通話中';
  pushLine(`保留 ${min}分。待たされた側の呼吸が、変わっている。`,'sys');
  renderAside();
};

/* ---------- 折り返し発信（追補 §3） ---------- */
function dial(id){
  const d = DIALS.find(x=>x.id===id); if(!d) return;
  S.dialLog = S.dialLog || {};
  if(timeLeft() <= 0){
    S.dialLog[id] = '——交換台はもう夜勤明けだ。外線は朝まで繋がらない。';
    openPanel('dial'); return;
  }
  const r = d.resp();
  S.dialLog[id] = r.log;
  S.hist.push({d:S.day, c:clockStr(S.clock), w:'（発信）'+d.label, len:(r.len||1)+'分', r:r.result});
  S.clock += (r.len||1);
  if(r.ring==='none') AU.beep(180,.6,.03,'square');
  else if(r.ring==='old') AU.ring('old');
  else { AU.beep(520,.25,.03,'sine'); setTimeout(()=>AU.beep(520,.25,.03,'sine'),600); }
  if(r.noise!=null) setNoise(r.noise);
  if(r.set) Object.entries(r.set).forEach(([k,v])=>SET(k,v));
  if(r.par) applyPar(r.par);
  if(r.memo) S.memo.push({d:S.day,t:r.memo[0],x:r.memo[1],k:r.memo[2]||null,mark:null});
  if(r.evd) S.evd.push({t:r.evd[0], x:r.evd[1]});
  if(r.toast) toast(r.toast);
  refreshHead(); checkShift(); renderNav(); renderAside(); saveAll();
  if(r.still) unlockStill(r.still, ()=>openPanel('dial')); else openPanel('dial');
}

/* ---------- 実行 ---------- */
function loadChapter(id, startLabel){
  pendingSec = null;
  script = SCENARIO[id]; labels = {};
  script.forEach((n,i)=>{ if(n.n) labels[n.n] = i; });
  S.chapter = id;
  pc = startLabel!=null ? labels[startLabel] : 0;
}
function jump(l){ if(labels[l]==null){ console.warn('no label',l); return; } pc = labels[l]; }

function step(){
  if(running) return;
  if(pc >= script.length){ return; }
  const nd = script[pc++];
  exec(nd);
}
function advance(){ // ▼クリック
  if(skipType()){ $('#next').style.display='block'; return; }
  $('#next').style.display='none';
  step();
}
function exec(nd){
  // --- 表示系(ここで実行を中断する。同一ノードの他のキーは評価されない) ---
  if(nd.say!=null){
    const m = CHARS[nd.c] || CHARS.UNK;
    S.clock += (nd.min || 1); refreshHead(); checkShift();
    wv.col = m.col;
    const el = pushLine(`<span class="nm" style="color:${m.col}">${nd.nm||m.name}</span>`, nd.w?'wsp':'');
    running = true;
    typeInto(el, nd.say, nd.slow?46:22, ()=>{ running=false; $('#next').style.display='block'; });
    if(nd.se) AU.beep(...(SE[nd.se]||[600,.06,.02,'sine']));
    return;
  }
  if(nd.me!=null){
    S.clock += 1; refreshHead(); wv.col = CHARS.ME.col;
    const el = pushLine(`<span class="nm">あなた</span>`, 'me');
    running = true; typeInto(el, nd.me, 20, ()=>{ running=false; $('#next').style.display='block'; });
    return;
  }
  if(nd.nar!=null){
    wv.col = '#5f6b7c';
    const el = pushLine('', 'nar'); running = true;
    typeInto(el, nd.nar, 18, ()=>{ running=false; $('#next').style.display='block'; });
    return;
  }
  if(nd.sys!=null){
    pushLine(nd.sys, 'sys'); AU.beep(1200,.04,.02,'square'); $('#next').style.display='block'; return;
  }
  // --- 演出系(即時・自動で次へ) ---
  if(nd.call){ startCall(nd.call); }
  if(nd.hang!=null){ endCall(nd.hang, nd.hangKind); }
  if(nd.ring){ AU.ring(nd.ring); }
  if(nd.sec!=null) pendingSec = nd.sec;
  if(nd.noise!=null) setNoise(nd.noise);
  if(nd.fx) fx(nd.fx);
  if(nd.amb!=null) AU.ambient(nd.amb);
  if(nd.clock || nd.day){ applyTime(nd); refreshHead(); }
  // --- データ系(core と共通) ---
  applyData(nd);
  // --- 演出系(中断するもの) ---
  if(nd.still){ saveAll(); unlockStill(nd.still, step); return; } // スチルを閉じると再開
  if(nd.chapTitle){ S.chapTitle = nd.chapTitle; }
  if(nd.card){ showChapCard(nd.card); return; }
  if(nd.wait){ setTimeout(step, nd.wait); return; }
  // --- 制御系 ---
  if(nd.hold){ holdLine(nd.hold); }
  if(nd.resume){ resumeLine(); }
  if(nd.multi){ showMulti(nd); return; }
  if(nd.ch){ showChoices(nd); return; }
  const target = resolveJump(nd); if(target) jump(target);
  if(nd.chap){ saveAll(); loadChapter(nd.chap); $('#text').innerHTML=''; step(); return; }
  if(nd.end){ return endGame(nd.end); }
  if(nd.clear){ $('#text').innerHTML=''; }
  step();
}
/* 効果音キーの対応表(se: 用)。現状シナリオ未使用だが、参照先が無いと
   se: を書いても常に既定音になってしまうため実体を用意しておく。 */
const SE = {};

/* 通話 */
function startCall(c){
  S.cur = c; S.callStart = S.clock;
  $('#cWho').textContent = c.who;
  $('#cWho').style.color = (CHARS[c.c]||CHARS.UNK).col;
  $('#cMeta').textContent = (c.num||'番号非通知') + ' ／ 通話中';
  AU.beep(700,.08,.03,'sine');
}
function endCall(reason, kind){
  if(S.cur){
    const len = Math.max(1, S.clock - S.callStart);
    S.hist.push({d:S.day, c:clockStr(S.callStart), w:S.cur.who, len:len+'分', r:reason||'通話終了'});
  }
  AU.hang(kind || 'normal');
  $('#cWho').textContent = 'みおはらライン';
  $('#cWho').style.color = '';
  $('#cMeta').textContent = '待機中 — 着信なし';
  S.cur = null;
}

/* 選択肢 */
function showChoices(nd){
  const box = $('#choices'); box.innerHTML = ''; $('#next').style.display='none';
  const list = visibleChoices(nd);
  list.forEach(o=>{
    const ok = cond(o.req);
    const b = document.createElement('button');
    b.className = 'cbtn' + (o.silent?' silent':'') + (ok?'':' lock') + (o.hide?' hid':'');
    const cost = o.cost || 2;
    b.innerHTML = (o.tag?`<span class="tag">${o.tag}</span>`:'') + o.t +
      (cost >= 5 ? ` <span class="tag" style="color:#c4443a">— ${cost}分</span>` : '') +
      (ok?'':' <span class="tag">— まだ言葉が見つからない</span>');
    b.onclick = ()=>{ if(!ok) return; AU.click(); pick(o, nd); };
    box.appendChild(b);
  });
  const sec = nd.sec != null ? nd.sec : pendingSec;
  pendingSec = null;
  if(sec) startTimer(realSec(sec), ()=>{ // 制限時間切れ = 沈黙してしまった
    pick(timeoutChoice(nd), nd, true);
  });
}

/* ---------- 同時着信（追補 §6-2） ----------
   取れるのは一本だけ。取らなかった回線はその場で留守電に落ち、
   §5 の保存期限ルールにそのまま接続する。 */
function showMulti(nd){
  const box = $('#choices'); box.innerHTML = ''; $('#next').style.display='none';
  pushLine('複数の回線が同時に鳴っています。取れるのは一本です。','sys');
  AU.ring('normal'); setTimeout(()=>AU.ring('normal'), 300);
  const drop = (taken)=> nd.multi.forEach(x=>{
    if(x === taken) return;
    if(x.vm) applyData({vm:x.vm});
    if(x.skip) applyPar(x.skip);
  });
  nd.multi.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'cbtn';
    b.innerHTML = `<span class="tag">回線 ${i+1}</span>${o.label}` +
      (o.note?`<span class="tag" style="display:block;margin:4px 0 0">${o.note}</span>`:'');
    b.onclick = ()=>{
      clearInterval(tmr); $('#timer').style.transform='scaleX(0)';
      AU.click(); box.innerHTML = '';
      drop(o);
      pushLine(`回線${i+1}に応答。他の回線は留守番電話に転送された。`,'sys');
      renderNav(); renderAside(); saveAll();
      if(o.go) jump(o.go);
      step();
    };
    box.appendChild(b);
  });
  const sec = nd.sec != null ? nd.sec : pendingSec;
  pendingSec = null;
  if(sec) startTimer(realSec(sec), ()=>{   // 迷っているうちに、どちらも切れる
    box.innerHTML = '';
    drop(null);
    pushLine('迷っているあいだに、どちらの呼び出し音も止まった。','sys');
    SET('MULTI_MISS', CNT('MULTI_MISS')+1);
    renderNav(); renderAside();
    if(nd.miss) jump(nd.miss);
    step();
  });
}
function startTimer(sec, cb){
  const bar = $('#timer'); let t = sec*1000; const t0 = Date.now();
  bar.style.transform = 'scaleX(1)';
  clearInterval(tmr);
  tmr = setInterval(()=>{
    const p = 1 - (Date.now()-t0)/t;
    bar.style.transform = 'scaleX('+Math.max(0,p)+')';
    if(p<=0){ clearInterval(tmr); bar.style.transform='scaleX(0)'; cb(); }
  }, 50);
}
function pick(o, nd, timedout){
  clearInterval(tmr); $('#timer').style.transform='scaleX(0)';
  $('#choices').innerHTML = '';
  if(o.say!==false && o.t) pushLine(`<span class="nm">あなた</span>${timedout?'（沈黙した）':(o.line||o.t)}`, 'me');
  applyChoice(o);
  refreshHead(); checkShift(); renderAside();
  if(o.go){ jump(o.go); }
  saveAll();
  step();
}

/* 章タイトルカード */
function showChapCard(c){
  const d = document.createElement('div'); d.className='chapcard';
  d.innerHTML = `<div class="no">${c[0]}</div><div class="ti">${c[1]}</div><div class="dt">${c[2]||''}</div>`;
  document.body.appendChild(d);
  AU.ambient(c[3]||0);
  setTimeout(()=>{ d.style.transition='opacity 1s'; d.style.opacity=0;
    setTimeout(()=>{ d.remove(); step(); }, 1000); }, 2400);
}

/* ---------- エンディング ---------- */
function endGame(tag){
  const id = tag === 'check' ? judge() : tag;
  AU.stopAmb();
  G.endings = G.endings||[]; if(!G.endings.includes(id)) G.endings.push(id);
  G.memo = S.memo.slice(); G.evd = S.evd.slice(); G.rel = S.rel.slice(); G.tl = S.tl.slice();
  G.loops = (G.loops||0) + 1;
  G.recs = G.recs||[]; G.stills = G.stills||[];
  saveAll();
  const e = ENDINGS[id];
  const ov = document.createElement('div'); ov.className='ov fade';
  ov.innerHTML = `<div class="endname">${e.name}</div>
    <div class="sub" style="margin:18px 0 26px">${id} END</div>
    <p>${e.text}</p>
    <div style="margin-top:34px">
      <button class="mbtn" id="eNext">次の周回へ<small>録音・メモ・証拠・年表・スチルを引き継ぐ</small></button>
      <button class="mbtn" id="eTitle">タイトルへ</button></div>`;
  document.body.appendChild(ov);
  $('#eNext').onclick = ()=> startGame(true);
  $('#eTitle').onclick = ()=> location.reload();
}

/* ---------- 起動 ---------- */
async function boot(){
  setGlobal(await loadKey('global') || {loops:0, endings:[], recs:[], stills:[]});
  const sv = await loadKey('save');
  const ov = $('#title');
  ov.innerHTML = `<h1><small>MIDNIGHT LINE</small>ミッドナイトライン</h1>
    <div class="sub">澪原市いのちの電話</div>
    <button class="mbtn" id="mNew">夜勤に入る<small>${G.loops?('周回 '+(G.loops+1)+'／引き継ぎあり'):'DAY 01 22:00 から'}</small></button>
    ${sv?'<button class="mbtn" id="mCont">続きから<small>DAY '+sv.day+' ／ '+sv.chapTitle.split(' ')[0]+'</small></button>':''}
    <button class="mbtn" id="mInfo">この電話について<small>操作と、この仕事の心得</small></button>
    <div class="sub" style="margin-top:30px;font-size:11px">到達エンディング ${(G.endings||[]).length} / 5　　発見した録音 ${(G.recs||[]).length}</div>`;
  $('#mNew').onclick = ()=> startGame(G.loops>0);
  $('#mInfo').onclick = ()=> showInfo();
  if(sv) $('#mCont').onclick = ()=>{ setState(sv); $('#title').remove(); resume(); };
  waveInit();
  document.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ if($('#choices').children.length===0) advance(); } });
  $('#textwrap').onclick = ()=>{ if($('#choices').children.length===0) advance(); };
  $('#next').onclick = advance;
  $('#pClose').onclick = ()=> $('#panel').classList.remove('on');
  $('#bMenu').onclick = ()=> openPanel('sys');
  $('#bSound').onclick = ()=>{ AU.on = !AU.on; $('#bSound').textContent = AU.on?'♪ ON':'♪ OFF';
    if(!AU.on) AU.stopAmb(); else AU.ambient(0); };
  $$('#mobtabs button').forEach(b=>b.onclick=()=>{
    $$('#mobtabs button').forEach(x=>x.classList.remove('act')); b.classList.add('act');
    $('#nav').classList.toggle('on', b.dataset.m==='nav');
    $('#aside').classList.toggle('on', b.dataset.m==='aside');
  });
}
function showInfo(){
  const ov = document.createElement('div'); ov.className='ov fade';
  ov.innerHTML = `<h1 style="font-size:24px;letter-spacing:.2em">この電話について</h1>
  <p style="text-align:left">あなたは澪原市の夜間電話相談員です。現場へは行けません。声、息づかい、物音、沈黙、雑音、そして話の矛盾——受話器から届くものだけが手がかりです。<br><br>
  ・画面をタップ／スペースキーで進みます。<br>
  ・選択肢には〈傾聴〉〈確認〉〈指摘〉〈沈黙〉などの札があります。沈黙もまた答えです。<br>
  ・通話はすべて自動録音されます。<b style="color:#f0c674;font-weight:400">0.5倍速や逆再生で聴き直すと、その時は聞こえなかった声が入っていることがあります。</b><br>
  ・信頼・疑念・恐怖・ストレスは相手ごとに変動し、話してもらえる内容そのものが変わります。<br>
  ・一周目で救えるとは限りません。録音とメモは次の周回へ引き継がれます。<br><br>
  <span style="color:#8792a2">切ってしまった電話は、二度と同じようには鳴りません。</span></p>
  <button class="mbtn" style="margin-top:26px" onclick="this.parentNode.remove()">戻る</button>`;
  document.body.appendChild(ov);
}
function startGame(carry){
  setState(newState(carry ? G : null));
  if(carry){
    S.loop = (G.loops||0) + 1;
    (G.memo||[]).forEach(m=>S.memo.push(m));
    (G.evd||[]).forEach(e=>S.evd.push(e));
    (G.rel||[]).forEach(r=>S.rel.push(r));
    if(G.tl && G.tl.length > S.tl.length) S.tl = G.tl.slice();
    SET('LOOP_02', S.loop);
  }
  const t = $('#title'); if(t) t.remove();
  $$('.ov').forEach(o=>o.remove());   // エンディング画面から直接次の周回へ入る場合
  resume(true);
}
function resume(fresh){
  renderNav(); renderAside(); refreshHead();
  $('#text').innerHTML = '';
  loadChapter(fresh ? 'pro' : S.chapter);
  AU.ambient(0);
  step();
}
window.addEventListener('load', boot);
</script>
